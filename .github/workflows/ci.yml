name: CI

on:
  push:
    branches: [main, phasec]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest -q `
            --cov=core --cov=fixes --cov=powershell `
            --cov-report=term `
            --cov-report=xml:coverage.xml `
            --cov-fail-under=80

      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  browser:
    name: Headless browser smoke
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies and Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt playwright
          python -m playwright install chromium

      - name: Browser smoke test
        run: python scripts/browser_smoke.py

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: artifacts/browser-smoke
          if-no-files-found: warn

  build:
    name: Build and smoke-test exe
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt pyinstaller

      - name: Build NetScope.exe
        run: ./scripts/build.ps1 -Clean

      - name: Frozen smoke test
        run: python scripts/frozen_smoke.py --exe dist/NetScope.exe

      - name: Frozen pytest checks
        run: |
          $env:NETSCOPE_EXE = (Resolve-Path dist/NetScope.exe).Path
          python -m pytest tests/test_frozen.py -q

      - name: Report exe size
        run: |
          $size = (Get-Item dist/NetScope.exe).Length
          Write-Host ("NetScope.exe: {0:N1} MB" -f ($size / 1MB))
          "NetScope.exe size: {0:N1} MB" -f ($size / 1MB) | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: NetScope-windows-x64
          path: dist/NetScope.exe
          if-no-files-found: error
